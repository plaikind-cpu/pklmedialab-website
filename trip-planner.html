<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>PKL Trip Planner — San Diego to Moose Lake</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a18; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── Header ── */
header { background: #1a1a18; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
header h1 { font-size: 16px; font-weight: 500; white-space: nowrap; }
.route-tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.route-tab { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1.5px solid #444; background: transparent; color: #ccc; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.route-tab:hover { border-color: #888; color: #fff; }
.route-tab.active { background: #2a6ebb; border-color: #2a6ebb; color: #fff; }

/* ── Controls ── */
.controls { background: #fff; border-bottom: 1px solid #e0dfd8; padding: 8px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.ctrl-label { font-size: 12px; color: #888; font-weight: 500; white-space: nowrap; }
.toggle-btn { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1.5px solid #d0cfc8; background: #fff; cursor: pointer; color: #555; transition: all 0.15s; white-space: nowrap; }
.toggle-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
.toggle-btn.opt-active { background: #854f0b; color: #fff; border-color: #854f0b; }
.divider { width: 1px; background: #e0dfd8; height: 24px; flex-shrink: 0; }
.search-wrap { display: flex; gap: 6px; align-items: center; position: relative; }
#place-search { font-size: 12px; padding: 4px 8px; border: 1px solid #d0cfc8; border-radius: 4px; width: 180px; }
#add-stop-btn { font-size: 11px; padding: 4px 10px; border-radius: 4px; border: 1.5px solid #2a6ebb; background: #fff; color: #2a6ebb; cursor: pointer; }
#add-stop-btn:hover { background: #2a6ebb; color: #fff; }

/* Google Places autocomplete dropdown must render above everything else */
.pac-container { z-index: 10000 !important; }

/* ── Main layout ── */
.main { display: flex; flex: 1; min-height: 0; }
#map { flex: 1; min-width: 0; }

/* ── Sidebar ── */
.sidebar { width: 340px; flex-shrink: 0; overflow-y: auto; background: #fff; border-left: 1px solid #e0dfd8; display: flex; flex-direction: column; }
.sidebar-header { background: #f5f4f0; padding: 8px 14px; font-size: 10px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid #e0dfd8; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
.sidebar-header span { color: #2a6ebb; font-size: 10px; font-weight: 500; cursor: pointer; text-transform: none; letter-spacing: 0; }
.stops-list { flex: 1; overflow-y: auto; }

/* ── Day cards ── */
.day-card { border-bottom: 1px solid #e0dfd8; padding: 11px 14px 11px 28px; cursor: pointer; transition: background 0.1s; border-left: 3px solid transparent; position: relative; }
.day-card:hover { background: #f9f8f5; }
.day-card.active { background: #f0f4ff; border-left-color: #2a6ebb; }
.day-card.type-home { border-left-color: #534ab7; background: #faf9ff; }
.day-card.type-optional { border-left-color: #854f0b; background: #fffaf4; opacity: 0.85; }
.day-card.type-dayvisit { border-left-color: #888780; }
.day-card.type-destination { border-left-color: #0f6e56; background: #f4fdf9; }
.day-card.type-custom { border-left-color: #d4537e; }
.day-card.dragging { opacity: 0.4; }
.day-card.drag-over-top { box-shadow: inset 0 2px 0 0 #2a6ebb; }
.day-card.drag-over-bottom { box-shadow: inset 0 -2px 0 0 #2a6ebb; }
.drag-handle { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); color: #ccc; cursor: grab; font-size: 14px; line-height: 1; padding: 4px 2px; user-select: none; }
.drag-handle:hover { color: #888; }
.drag-handle:active { cursor: grabbing; }
.loading-stop { opacity: 0.55; }
.loading-stop .day-note::after { content: " ⏳ fetching trip data…"; color: #888; }

/* ── Excluded stops ── */
.excluded-section { border-top: 2px solid #e0dfd8; }
.excluded-header { background: #f5f4f0; padding: 8px 14px; font-size: 10px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid #e0dfd8; }

.excluded-card-title { font-size: 12px; color: #555; }
.restore-btn { font-size: 10px; padding: 3px 9px; border-radius: 4px; border: 1px solid #2a6ebb; background: #fff; color: #2a6ebb; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.restore-btn:hover { background: #2a6ebb; color: #fff; }

.day-sub { font-size: 11px; color: #777; }
.day-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.badge { font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 500; }
.bg-green { background: #eaf3de; color: #3b6d11; }
.bg-gray { background: #f0efe8; color: #5f5e5a; border: 1px solid #d3d1c7; }
.bg-amber { background: #faeeda; color: #633806; }
.bg-blue { background: #e6f1fb; color: #0c447c; }
.bg-purple { background: #eeedfe; color: #3c3489; }
.bg-teal { background: #e1f5ee; color: #085041; }
.bg-pink { background: #fbeaf0; color: #72243e; }
.day-note { font-size: 11px; color: #777; margin-top: 5px; line-height: 1.5; }
.temp { font-size: 11px; color: #999; margin-top: 3px; }
.temp .hot { color: #a32d2d; font-weight: 600; }
.temp .mid { color: #854f0b; font-weight: 600; }
.temp .ok { color: #444; font-weight: 600; }
.temp .cool { color: #185fa5; font-weight: 600; }
.remove-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 3px; }
.remove-btn:hover { color: #e24b4a; background: #fcebeb; }

/* ── Info banner ── */
.info-banner { margin: 8px 12px; padding: 7px 10px; border-radius: 6px; font-size: 11px; line-height: 1.5; }
.banner-amber { background: #fff8ee; border: 1px solid #f0c070; color: #633806; }
.banner-blue { background: #e6f1fb; border: 1px solid #85b7eb; color: #042c53; }

/* ── URL share bar ── */
.share-bar { border-top: 1px solid #e0dfd8; padding: 8px 12px; display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.share-bar input { flex: 1; font-size: 10px; padding: 4px 6px; border: 1px solid #d0cfc8; border-radius: 4px; color: #555; background: #f9f8f5; }
.share-bar button { font-size: 11px; padding: 4px 10px; border-radius: 4px; border: 1.5px solid #2a6ebb; background: #fff; color: #2a6ebb; cursor: pointer; white-space: nowrap; }
.share-bar button:hover { background: #2a6ebb; color: #fff; }

.save-bar { border-top: 1px solid #e0dfd8; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; background: #fafaf8; }
.save-bar button { font-size: 11px; padding: 5px 12px; border-radius: 4px; border: 1.5px solid #0f6e56; background: #0f6e56; color: #fff; cursor: pointer; white-space: nowrap; font-weight: 500; }

/* ── Info window ── */
.iw { max-width: 240px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.iw h3 { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.iw .iw-sub { font-size: 11px; color: #666; margin-bottom: 5px; }
.iw table { width: 100%; font-size: 11px; border-collapse: collapse; }
.iw td { padding: 2px 0; }
.iw td:first-child { color: #999; padding-right: 8px; white-space: nowrap; }
.iw td:last-child { font-weight: 500; }
.iw .iw-note { font-size: 11px; color: #666; margin-top: 5px; line-height: 1.5; border-top: 1px solid #eee; padding-top: 5px; }

@media (max-width: 700px) {
  .main { flex-direction: column; }
  #map { height: 45vh; }
  .sidebar { width: 100%; height: 55vh; border-left: none; border-top: 1px solid #e0dfd8; }
  #place-search { width: 130px; }
}

const STORAGE_KEY = 'pkl_trip_planner_state_v1';

function buildStateObject() {
  const state = { r: activeRouteId, t: toggleStates, rm: {} };
  for (const [rid, set] of Object.entries(removedStops)) {
    if (set.size > 0) state.rm[rid] = [...set];
  }
  if (Object.keys(customStops).some(k => customStops[k].length > 0)) {
    state.cs = customStops;
  }
  if (Object.keys(stopOrder).some(k => stopOrder[k] && stopOrder[k].length > 0)) {
    state.so = stopOrder;
  }
  if (Object.keys(excludedCustom).some(k => excludedCustom[k] && excludedCustom[k].length > 0)) {
    state.ec = excludedCustom;
  }
  return state;
}

function encodeState() {
  return btoa(JSON.stringify(buildStateObject()));
}

function applyState(state) {
  if (!state) return;
  if (state.r) activeRouteId = state.r;
  if (state.t) toggleStates = state.t;
  if (state.rm) {
    for (const [rid, arr] of Object.entries(state.rm)) {
      removedStops[rid] = new Set(arr);
    }
  }
  if (state.cs) customStops = state.cs;
  if (state.so) stopOrder = state.so;
  if (state.ec) excludedCustom = state.ec;
}

function decodeState(hash) {
  try {
    applyState(JSON.parse(atob(hash)));
  } catch(e) {}
}

function saveToLocalStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(buildStateObject()));
    showSaveStatus('Auto-saved', false);
  } catch(e) {
    showSaveStatus('Save failed — storage unavailable', true);
  }
}

function manualSave() {
  saveToLocalStorage();
  showSaveStatus('Saved ✓', false, true);
}

function showSaveStatus(text, isError, emphasize) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('saved', !isError);
  if (emphasize) {
    setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 2500);
  }
}

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) applyState(JSON.parse(raw));
    return !!raw;
  } catch(e) { return false; }
}

function updateShareUrl() {
  const encoded = encodeState();
  const url = `${location.origin}${location.pathname}#${encoded}`;
  const el = document.getElementById('share-url');
  if (el) el.value = url;
  saveToLocalStorage();
}

function copyShareUrl() {

  navigator.clipboard.writeText(url).then(() => {

  });
}

function initMap() {
  // If this browser already has saved local state, trust it — that's the freshest
  // record of what the user was working on. Only fall back to a URL hash (a shared
  // link) when there's no local state to restore. Either way, strip the hash from
  // the address bar immediately afterward so it can never silently override a
  // future autosave on this same tab.
  const hadLocalState = loadFromLocalStorage();
  if (!hadLocalState && location.hash) {
    decodeState(location.hash.slice(1));
  }
  if (location.hash) {
    history.replaceState(null, '', location.pathname);
  }

  // Init defaults for toggle states
  ROUTES.forEach(route => {
    route.toggles.forEach(t => {
      const key = `${route.id}_${t.id}`;
      if (toggleStates[key] === undefined) toggleStates[key] = t.defaultOn;
    });
    if (!customStops[route.id]) customStops[route.id] = [];
    if (!removedStops[route.id]) removedStops[route.id] = new Set();

function getActiveStops() {
  const route = ROUTES.find(r => r.id === activeRouteId);
  const removed = removedStops[activeRouteId] || new Set();
  const custom = customStops[activeRouteId] || [];

  const base = route.stops.filter(s => {
    if (removed.has(s.id)) return false;
    if (s.type === 'optional') return isToggleOn(s.toggleId);
    return true;
  });

  let combined = [...base, ...custom];

  // Apply saved custom order, if one exists for this route
  const order = stopOrder[activeRouteId];
  if (order && order.length) {
    const byId = {};
    combined.forEach(s => byId[s.id] = s);
    const ordered = order.filter(id => byId[id]).map(id => byId[id]);
    // Append any stops not yet in the saved order (newly toggled-on, etc.)
    combined.forEach(s => { if (!order.includes(s.id)) ordered.push(s); });
    combined = ordered;
  }

  return combined;
}

    });

// ═══════════════════════════════════════════════════════════════
//  DIRECTIONS / ROUTE LINE
// ═══════════════════════════════════════════════════════════════

function drawRoute() {
  directionsRenderers.forEach(r => r.setMap(null));
  directionsRenderers = [];
  if (!showRoute) return;

  const stops = getActiveStops().filter(s => s.lat && s.lng);
  if (stops.length < 2) return;

  // Split into segments to handle Google's 8-waypoint limit
  const chunkSize = 8;
  for (let i = 0; i < stops.length - 1; i += chunkSize - 1) {
    const chunk = stops.slice(i, i + chunkSize);
    if (chunk.length < 2) continue;

    const origin = { lat: chunk[0].lat, lng: chunk[0].lng };
    const destination = { lat: chunk[chunk.length - 1].lat, lng: chunk[chunk.length - 1].lng };
    const waypoints = chunk.slice(1, -1).map(s => ({
      location: { lat: s.lat, lng: s.lng },
      stopover: true
    }));

    const isOptSegment = chunk.some(s => s.type === 'optional');
    const renderer = new google.maps.DirectionsRenderer({
      suppressMarkers: true,
      polylineOptions: {
        strokeColor: isOptSegment ? '#854f0b' : '#2a6ebb',
        strokeOpacity: isOptSegment ? 0.55 : 0.7,
        strokeWeight: isOptSegment ? 3 : 4
      }
    });
    renderer.setMap(map);
    directionsRenderers.push(renderer);

    directionsService.route({ origin, destination, waypoints, travelMode: 'DRIVING' },
      (result, status) => {
        if (status === 'OK') {
          renderer.setDirections(result);
        } else {
          console.error('Directions request failed:', status, { origin, destination, waypoints });
        }
      }
    );
  }
}

//  SIDEBAR

function buildSidebar() {
  const list = document.getElementById('stops-list');
  list.innerHTML = '';

  const stops = getActiveStops();

  stops.forEach(stop => {
    const card = document.createElement('div');
    card.className = `day-card type-${stop.type}` + (stop.loading ? ' loading-stop' : '');
    card.id = `card-${stop.id}`;
    card.draggable = true;
    card.dataset.stopId = stop.id;
    card.onclick = (e) => { if (!e.target.classList.contains('remove-btn') && !e.target.classList.contains('drag-handle')) focusStop(stop); };

    // Drag-and-drop reordering
    card.addEventListener('dragstart', (e) => {
      draggedStopId = stop.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.day-card').forEach(c => c.classList.remove('drag-over-top', 'drag-over-bottom'));
      stopAutoScroll();
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!draggedStopId || draggedStopId === stop.id) return;
      const rect = card.getBoundingClientRect();
      const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
      card.classList.toggle('drag-over-top', isTopHalf);
      card.classList.toggle('drag-over-bottom', !isTopHalf);
      autoScrollList(e.clientY);
    });
    card.addEventListener('dragleave', () => {
      card.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      const isTopHalf = card.classList.contains('drag-over-top');
      card.classList.remove('drag-over-top', 'drag-over-bottom');
      if (draggedStopId && draggedStopId !== stop.id) {
        reorderStop(draggedStopId, stop.id, isTopHalf);
      }
      draggedStopId = null;
    });

    const hookupBadge = stop.hookups
      ? `<span class="badge ${hookupBadgeClass(stop.hookups)}">${stop.hookups}</span>`
      : '';

    const tempHtml = stop.temp
      ? `<div class="temp">Aug avg: ${formatTemp(stop.temp)}</div>` : '';

    // Every stop can now be removed and reordered, including defaults
    card.innerHTML = `
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <div class="day-label">${stop.day ? `Day ${stop.day}${stop.date ? ' · ' + stop.date : ''}` : stop.type === 'optional' ? 'Optional stop' : stop.type === 'dayvisit' ? 'Day visit' : ''}</div>
      <div class="day-title">${stop.title}</div>
      <div class="day-sub">${stop.sub || ''}</div>
      <div class="day-meta">${hookupBadge}</div>
      ${tempHtml}
      ${stop.note ? `<div class="day-note">${stop.note}</div>` : ''}
      <button class="remove-btn" onclick="removeStop(event,'${stop.id}')" title="Remove stop">×</button>
    `;
    list.appendChild(card);
  });

  buildExcludedSection();
}

function buildExcludedSection() {
  const container = document.getElementById('excluded-section');
  const excluded = getExcludedStops();
  if (!excluded.length) {
    container.innerHTML = '';
    return;
  }
  const cards = excluded.map(stop => `
    <div class="excluded-card">
      <span class="excluded-card-title">${stop.title}</span>
      <button class="restore-btn" onclick="restoreStop('${stop.id}')">Restore</button>
    </div>
  `).join('');
  container.innerHTML = `
    <div class="excluded-section">
      <div class="excluded-header">Excluded stops (${excluded.length})</div>
      ${cards}
    </div>
  `;
}

function reorderStop(draggedId, targetId, insertBefore) {
  const stops = getActiveStops();
  const ids = stops.map(s => s.id);
  const fromIdx = ids.indexOf(draggedId);
  if (fromIdx === -1) return;
  ids.splice(fromIdx, 1);
  let toIdx = ids.indexOf(targetId);
  if (!insertBefore) toIdx += 1;
  ids.splice(toIdx, 0, draggedId);
  stopOrder[activeRouteId] = ids;
  renderAll();
}

// Auto-scroll the stops list when dragging near its top/bottom edge
let autoScrollInterval = null;
function autoScrollList(clientY) {
  const list = document.getElementById('stops-list');
  if (!list) return;
  const rect = list.getBoundingClientRect();
  const edgeZone = 50;
  const distFromTop = clientY - rect.top;
  const distFromBottom = rect.bottom - clientY;

  stopAutoScroll();

  if (distFromTop < edgeZone && distFromTop > -100) {
    const speed = Math.max(2, (edgeZone - distFromTop) / 3);
    autoScrollInterval = setInterval(() => { list.scrollTop -= speed; }, 16);
  } else if (distFromBottom < edgeZone && distFromBottom > -100) {
    const speed = Math.max(2, (edgeZone - distFromBottom) / 3);
    autoScrollInterval = setInterval(() => { list.scrollTop += speed; }, 16);
  }
}
function stopAutoScroll() {
  if (autoScrollInterval) {
    clearInterval(autoScrollInterval);
    autoScrollInterval = null;
  }
}

function hookupBadgeClass(hookups) {
  if (!hookups) return 'bg-gray';
  const h = hookups.toLowerCase();
  if (h.includes('electric') || h.includes('full') || h.includes('hookup')) return 'bg-green';
  if (h.includes('no hookup') || h.includes('primitive') || h.includes('no overnight')) return 'bg-gray';
  if (h.includes('limited')) return 'bg-amber';
  if (h.includes('home') || h.includes('family') || h.includes('owned')) return 'bg-teal';
  if (h.includes('day visit')) return 'bg-gray';
  return 'bg-blue';
}

function formatTemp(temp) {
  if (!temp) return '';
  const parts = temp.split('/').map(s => s.trim());
  const hi = parts[0], lo = parts[1] || '';
  const hiNum = parseInt(hi);
  const hiClass = hiNum >= 95 ? 'hot' : hiNum >= 85 ? 'mid' : 'ok';
  return `<span class="${hiClass}">${hi}</span> / <span class="cool">${lo}</span>`;
}

// ═══════════════════════════════════════════════════════════════
//  STOP INTERACTIONS
// ═══════════════════════════════════════════════════════════════

function focusStop(stop) {
  if (!stop.lat || !stop.lng) return;
  map.panTo({ lat: stop.lat, lng: stop.lng });
  map.setZoom(9);
  Object.values(infoWindows).forEach(w => w.close());
  if (infoWindows[stop.id]) infoWindows[stop.id].open(map, markers[stop.id]);
  highlightCard(stop.id);
}

function highlightCard(id) {
  document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`card-${id}`);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function removeStop(e, stopId) {
  e.stopPropagation();
  const route = ROUTES.find(r => r.id === activeRouteId);
  const isDefault = route.stops.some(s => s.id === stopId);
  if (isDefault) {
    removedStops[activeRouteId] = removedStops[activeRouteId] || new Set();
    removedStops[activeRouteId].add(stopId);
  } else {
    const list = customStops[activeRouteId] || [];
    const stop = list.find(s => s.id === stopId);
    customStops[activeRouteId] = list.filter(s => s.id !== stopId);
    if (stop) {
      excludedCustom[activeRouteId] = excludedCustom[activeRouteId] || [];
      excludedCustom[activeRouteId].push(stop);
    }
  }
  if (stopOrder[activeRouteId]) {
    stopOrder[activeRouteId] = stopOrder[activeRouteId].filter(id => id !== stopId);
  }
  renderAll();
}

function restoreStop(stopId) {
  const route = ROUTES.find(r => r.id === activeRouteId);
  const isDefault = route.stops.some(s => s.id === stopId);
  if (isDefault) {
    if (removedStops[activeRouteId]) removedStops[activeRouteId].delete(stopId);
  } else {
    const list = excludedCustom[activeRouteId] || [];
    const stop = list.find(s => s.id === stopId);
    excludedCustom[activeRouteId] = list.filter(s => s.id !== stopId);
    if (stop) {
      customStops[activeRouteId] = customStops[activeRouteId] || [];
      customStops[activeRouteId].push(stop);
    }
  }
  renderAll();
}

function getExcludedStops() {
  const route = ROUTES.find(r => r.id === activeRouteId);
  const removed = removedStops[activeRouteId] || new Set();
  const excludedDefaults = route.stops.filter(s => removed.has(s.id) && s.type !== 'optional');
  const excludedCustomList = excludedCustom[activeRouteId] || [];
  return [...excludedDefaults, ...excludedCustomList];
}

function resetRoute() {
  removedStops[activeRouteId] = new Set();
  customStops[activeRouteId] = [];
  excludedCustom[activeRouteId] = [];
  stopOrder[activeRouteId] = [];
  const route = ROUTES.find(r => r.id === activeRouteId);
  route.toggles.forEach(t => {
    toggleStates[`${activeRouteId}_${t.id}`] = t.defaultOn;
  });
  renderAll();
}

}

function addPlaceById(placeId) {
  placesService.getDetails({ placeId, fields: ['name', 'geometry'] }, (place, status) => {
    if (status === 'OK' && place.geometry) {
      addCustomStop(place.name, place.geometry.location.lat(), place.geometry.location.lng());
    }
  });
}

function addCustomStop(name, lat, lng) {
  const id = 'custom_' + Date.now();
  const stop = {
    id, type: 'custom', lat, lng,
    title: name,
    sub: 'Calculating…',
    hookups: '—',
    temp: '—',
    note: 'Added manually.',
    loading: true
  };
  customStops[activeRouteId] = customStops[activeRouteId] || [];
  customStops[activeRouteId].push(stop);
  renderAll();

  // Pan to new stop
  map.panTo({ lat, lng });
  map.setZoom(9);

  // Populate real data in the background, same fields as built-in stops
  populateStopData(stop);

  // Hard safety net: if nothing resolved within 10s for any reason, clear loading state
  setTimeout(() => {
    const list = customStops[activeRouteId] || [];
    const still = list.find(s => s.id === stop.id);
    if (still && still.loading) {
      console.warn('[waypoint] safety-net timeout fired for', still.title);
      applyStopUpdate(stop.id, null, null, null);
    }
  }, 10000);
}

function populateStopData(stop) {
  const stops = getActiveStops();
  const idx = stops.findIndex(s => s.id === stop.id);
  const prevStop = idx > 0 ? stops[idx - 1] : null;

  console.log('[waypoint] fetching data for', stop.title, stop.lat, stop.lng);

  const tasks = [withTimeout(fetchAugustTemp(stop.lat, stop.lng), 6000)];
  if (prevStop && prevStop.lat && prevStop.lng) {
    tasks.push(withTimeout(fetchDriveInfo(prevStop, stop), 6000));
  } else {
    tasks.push(Promise.resolve(null));
  }

  Promise.all(tasks).then(([temp, driveInfo]) => {
    console.log('[waypoint] resolved', stop.title, { temp, driveInfo });
    applyStopUpdate(stop.id, temp, driveInfo, prevStop);
  }).catch((err) => {
    console.error('[waypoint] populate failed', stop.title, err);
    applyStopUpdate(stop.id, null, null, prevStop);
  });
}

function applyStopUpdate(stopId, temp, driveInfo, prevStop) {
  // Find the actual array + index holding this stop and replace it in place,
  // rather than relying on a possibly-stale object reference.
  const list = customStops[activeRouteId] || [];
  const arrIdx = list.findIndex(s => s.id === stopId);
  if (arrIdx === -1) {
    console.warn('[waypoint] stop no longer in customStops, skipping update', stopId);
    return;
  }
  const updated = { ...list[arrIdx] };
  updated.temp = temp ? `${temp.high}°F / ${temp.low}°F` : 'Unavailable';
  updated.sub = driveInfo
    ? `${driveInfo.distance} · ${driveInfo.duration} from ${(prevStop ? prevStop.title : '').split(',')[0].split('—')[0].trim()}`
    : 'Custom waypoint';
  updated.note = (temp || driveInfo)
    ? 'Added manually. Hookup and campground info not available automatically — edit notes once you research the site, or drag to reorder.'
    : 'Added manually. Could not auto-fetch drive time or temperature — check your connection, or this may be outside Open-Meteo/Directions coverage.';
  updated.hookups = 'Unknown — verify locally';
  updated.loading = false;
  list[arrIdx] = updated;
  customStops[activeRouteId] = list;
  renderAll();
}

function fetchDriveInfo(fromStop, toStop) {
  return new Promise((resolve) => {
    directionsService.route({
      origin: { lat: fromStop.lat, lng: fromStop.lng },
      destination: { lat: toStop.lat, lng: toStop.lng },
      travelMode: 'DRIVING'
    }, (result, status) => {
      if (status === 'OK' && result.routes[0]) {
        const leg = result.routes[0].legs[0];
        resolve({ distance: leg.distance.text, duration: leg.duration.text });
      } else {
        resolve(null);
      }
    });
  });
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(() => resolve(null), ms))
  ]);
}

function fetchAugustTemp(lat, lng) {
  // Open-Meteo historical archive — single recent August, much faster than multi-year climate normals
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&start_date=2025-08-01&end_date=2025-08-31&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
  return fetch(url)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data || !data.daily || !data.daily.temperature_2m_max) return null;
      const highs = data.daily.temperature_2m_max.filter(v => v != null);
      const lows = data.daily.temperature_2m_min.filter(v => v != null);
      if (!highs.length || !lows.length) return null;
      const avg = arr => Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
      return { high: avg(highs), low: avg(lows) };
    })
    .catch(() => null);
}

window.initMap = initMap;
window.switchRoute = switchRoute;
window.toggleRoute = toggleRoute;
window.removeStop = removeStop;
window.restoreStop = restoreStop;
window.resetRoute = resetRoute;
window.addSearchedPlace = addSearchedPlace;
window.copyShareUrl = copyShareUrl;
window.manualSave = manualSave;
</script>
